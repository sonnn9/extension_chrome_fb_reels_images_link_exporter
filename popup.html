<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB Reels &amp; Photos Exporter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <h1>Facebook Reels &amp; Photos Exporter</h1>
    <p class="sub">Tự cuộn trang, gom link reel hoặc ảnh và xuất CSV.</p>

    <div class="grid">
      <label>
        <span>Chế độ thu thập</span>
        <select id="mode">
          <option value="auto" selected>Tự động (theo URL)</option>
          <option value="reels">Reels (video)</option>
          <option value="images">Ảnh (photos)</option>
        </select>
      </label>
      <label>
        <span>Delay mỗi lần cuộn (ms)</span>
        <input id="delayMs" type="number" min="500" step="100" value="1800" />
      </label>
      <label>
        <span>Số lần cuộn tối đa</span>
        <input id="maxScrolls" type="number" min="1" step="1" value="200" />
      </label>
      <label>
        <span>Dừng sau N lần không có link mới</span>
        <input id="idleRounds" type="number" min="1" step="1" value="4" />
      </label>
      <label class="checkbox-row">
        <input id="clearPrevious" type="checkbox" checked />
        <span>Xóa kết quả cũ trước khi quét</span>
      </label>
    </div>

    <div class="actions">
      <button id="startBtn" class="primary">Bắt đầu quét</button>
      <button id="stopBtn">Dừng</button>
      <button id="refreshBtn">Làm mới</button>
    </div>

    <div class="filter-card">
      <div class="filter-title">Bộ lọc trước khi xuất (áp dụng cho video/reels)</div>
      <div class="grid">
        <label>
          <span>Lọc theo lượt xem</span>
          <select id="viewFilter">
            <option value="0" selected>Không lọc (xuất tất cả)</option>
            <option value="100">Chỉ xuất video &gt; 100 view</option>
            <option value="500">Chỉ xuất video &gt; 500 view</option>
            <option value="1000">Chỉ xuất video &gt; 1.000 view</option>
            <option value="5000">Chỉ xuất video &gt; 5.000 view</option>
            <option value="10000">Chỉ xuất video &gt; 10.000 view</option>
            <option value="100000">Chỉ xuất video &gt; 100.000 view</option>
            <option value="custom">Tùy chỉnh…</option>
          </select>
        </label>
        <label id="customViewRow" class="hidden">
          <span>Chỉ xuất video có lượt xem lớn hơn</span>
          <input id="minViews" type="number" min="0" step="1" value="100" />
        </label>
        <label class="checkbox-row">
          <input id="includeUnknownViews" type="checkbox" />
          <span>Giữ cả video không đọc được lượt xem</span>
        </label>
      </div>
    </div>

    <div class="actions secondary-actions">
      <button id="exportBtn">Xuất CSV</button>
      <button id="copyBtn">Copy toàn bộ link</button>
    </div>

    <div id="hint" class="hint"></div>

    <div class="status-card">
      <div><strong>Trang:</strong> <span id="pageUrl">-</span></div>
      <div><strong>Trạng thái:</strong> <span id="scanState">-</span></div>
      <div><strong>Số link:</strong> <span id="foundCount">0</span></div>
      <div><strong>Sau khi lọc:</strong> <span id="filteredCount">0</span></div>
      <div><strong>Số lần cuộn:</strong> <span id="scrollCount">0</span></div>
      <div><strong>Lần thêm mới gần nhất:</strong> <span id="lastAddedAt">-</span></div>
    </div>

    <div>
      <strong>Xem trước</strong>
      <textarea id="preview" readonly placeholder="Kết quả sẽ hiện ở đây..."></textarea>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
